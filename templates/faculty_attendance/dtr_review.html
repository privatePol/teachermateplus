{% extends "admin_portal/base.html" %}
{% load static %}
{% block title %}Faculty DTR{% endblock %}
{% block admin_content %}
<style>
  .att-dtr{--green:#0f6c3c;--ink:#173b2b;max-width:1600px;min-width:0;color:#213428;overflow-wrap:anywhere}
  .att-dtr-hero{background:linear-gradient(115deg,#145832 0%,#34894a 57%,#d6b23d 100%);border-radius:1rem;color:#fff;padding:1.4rem;box-shadow:0 .6rem 1.2rem #16422620}.att-dtr-hero h1{color:#fff}
  .att-dtr-chip{display:inline-block;background:#fff;color:#173b2b;border-radius:2rem;padding:.3rem .7rem;margin:.15rem;font-weight:700;font-size:.85rem}.att-dtr-card{border:1px solid #d8e3da;border-radius:.8rem;box-shadow:0 .4rem 1rem #16422612;overflow:hidden}.att-dtr .att-dtr-card>.card-header{background:linear-gradient(115deg,#145832 0%,#34894a 57%,#d6b23d 100%);color:#fff;font-weight:700;font-size:1.08rem;padding:.85rem 1rem;border-bottom:0}.att-dtr .card-header>span:first-child{background:#145832;padding:.15rem .35rem;border-radius:.25rem}
  .att-dtr .form-control,.att-dtr .form-select,.att-dtr textarea{border:1px solid #b8c9bc;border-radius:.4rem;max-width:100%}.att-dtr :focus-visible{outline:3px solid #185abd!important;outline-offset:2px}.att-dtr-table{min-width:970px}.att-dtr-table th{background:#f2f6f2;font-size:.78rem;color:#435e48;text-transform:uppercase;letter-spacing:.025em}.att-dtr-table td,.att-dtr-table th{border-color:#dbe5dc;vertical-align:top;white-space:normal}.att-dtr-total{background:#f4faf4;border-left:4px solid var(--green);padding:.75rem;border-radius:.4rem}.att-dtr-problem{background:#fff8f6;border-left:4px solid #b02a37;padding:.7rem;margin:.5rem 0}.dtr-date-hint{font-size:.82rem;color:#465b4a}.dtr-date-error,.dtr-field-error,.att-dtr .errorlist{color:#842029;background:#f8d7da;border:2px solid #842029;border-radius:.3rem;font-weight:700;padding:.45rem;margin:.35rem 0;list-style-position:inside}.att-dtr-return{position:fixed;right:1rem;bottom:1rem;z-index:1030;width:3rem;height:3rem;border-radius:50%;box-shadow:0 .3rem .7rem #16422655;font-size:1.35rem}.att-dtr-return[hidden]{display:none}
  @media(max-width:767px){.att-dtr-hero{padding:1rem}.att-dtr .btn{max-width:100%}.att-dtr-return{right:.75rem;bottom:.75rem}}
  @media print{.att-dtr-hero,.att-dtr-hero h1,.att-dtr .att-dtr-card>.card-header,.att-dtr .card-header>span:first-child{background:white!important;color:black!important}.att-dtr-return{display:none}}
</style>
<div class="container-fluid py-2 att-dtr" data-dtr-review data-dtr-url="{% url 'faculty_attendance:dtr_review' %}">
  <div id="dtr-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <div id="dtr-inline-error" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
  <nav aria-label="breadcrumb"><ol class="breadcrumb small"><li class="breadcrumb-item"><a href="{% url 'faculty_attendance:cutoff_review' %}">Campus Attendance Cutoff</a></li><li class="breadcrumb-item active" aria-current="page">Faculty DTR</li></ol></nav>
  <div id="dtr-workspace">{% include "faculty_attendance/_dtr_workspace.html" %}</div>
</div>
{% if publication %}<script src="{% static 'faculty_attendance/dtr_review.js' %}?v=20261004-exceptions-batch"></script><script src="{% static 'faculty_attendance/dtr_admin_hours.js' %}?v=20261004"></script>{% endif %}
{% endblock %}
