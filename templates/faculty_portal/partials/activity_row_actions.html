<div class="d-flex align-items-center justify-content-end activity-row-actions">
  <a class="btn btn-sm btn-outline-primary activity-icon-btn" href="{% url 'faculty_portal:activity_scores' offering.id period.id row.id %}" title="Encode Scores" aria-label="Encode scores for {{ row.title }}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4h16v16H4z"></path>
      <path d="M8 8h8"></path>
      <path d="M8 12h3"></path>
      <path d="M14 12h2"></path>
      <path d="M8 16h2"></path>
      <path d="M13 16h3"></path>
    </svg>
    <span class="visually-hidden">Encode Scores</span>
  </a>
  {% if can_create_activity %}
  <a class="btn btn-sm btn-outline-secondary activity-icon-btn" href="{% url 'faculty_portal:period_activity_edit' offering.id period.id row.id %}" title="Edit" aria-label="Edit {{ row.title }}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"></path>
      <path d="M14 7l3 3"></path>
    </svg>
    <span class="visually-hidden">Edit</span>
  </a>
  <form method="post" action="{% url 'faculty_portal:period_activity_delete' offering.id period.id row.id %}" onsubmit="return confirm('Delete activity {{ row.title|escapejs }}? Existing encoded scores under this activity will be removed from computation.');">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-danger activity-icon-btn" title="Delete" aria-label="Delete {{ row.title }}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M6 7l1 13h10l1-13"></path>
        <path d="M9 7V4h6v3"></path>
      </svg>
      <span class="visually-hidden">Delete</span>
    </button>
  </form>
  {% endif %}
</div>
