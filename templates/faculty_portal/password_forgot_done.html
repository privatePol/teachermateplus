{% extends "shared/base_public.html" %}

{% block title %}Reset Link Sent | Faculty Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5 text-center">
          <h1 class="h4 mb-3">Check Your Email</h1>
          <p class="text-muted mb-4">
            If the account exists and has faculty access, a password reset link has been sent to the registered email.
          </p>
          <a href="{% url 'accounts:faculty_login' %}" class="btn btn-success">Back to Faculty Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
