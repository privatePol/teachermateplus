{% extends "shared/base_public.html" %}

{% block title %}Password Reset Complete | Admin Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5 text-center">
          <h1 class="h4 mb-3">Password Updated</h1>
          <p class="text-muted mb-4">
            Your password has been reset successfully. You can now sign in to the Admin Portal using your new password.
          </p>
          <a href="{% url 'accounts:admin_login' %}" class="btn btn-success">Go to Admin Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
