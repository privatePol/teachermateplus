{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>QuiTizz Projector | TeacherMate+</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/quitizz.css' %}?v=20261010-phase2c" rel="stylesheet"></head>
<body class="qt-projector-body"><main id="qt-projector" class="qt-projector" data-state-url="{% url 'quitizz:projector_state' public_id=session.public_id %}" data-socket-url="/ws/quitizz/{{ session.public_id }}/host/" data-qr-url="{% url 'quitizz:host_qr' public_id=session.public_id %}">
<header class="qt-brand"><div><h1>QuiTizz</h1><p>Powered by TeacherMate+</p></div><span class="qt-tagline">Scan. Play. Spark. Win.</span></header>
<section id="qt-presentation" class="qt-stage" aria-live="polite" aria-atomic="true"><h2>Opening presentation…</h2></section>
<p id="qt-connection" class="qt-connection" role="status">Connecting; HTTP recovery active.</p>
<noscript>JavaScript is required for the live presentation.</noscript></main>
<script>window.QuiTizzIcons = "{% static 'quitizz/icons.svg' %}";</script>
<script src="{% static 'js/quitizz_presentation.js' %}?v=20261010-phase2c"></script><script src="{% static 'js/quitizz_realtime.js' %}?v=20261010-phase2b-notification-only"></script><script src="{% static 'js/quitizz_projector.js' %}?v=20261010-phase2c"></script></body></html>
