{% extends "faculty_portal/base.html" %}
{% block title %}{{ error_title }} | TeacherMate+{% endblock %}
{% block faculty_content %}
<div class="card shadow-sm">
  <div class="card-body">
    <div class="alert alert-danger mb-3" role="alert">
      <h1 class="h4 alert-heading">{{ error_title }}</h1>
      <p>{{ error_explanation }}</p>
      <hr>
      <p class="mb-0"><strong>Next step:</strong> {{ error_next_action }}</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{ return_url }}">Return to question contributions</a>
      <a class="btn btn-outline-secondary" href="{% url 'faculty_portal:dashboard' %}">Faculty dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
