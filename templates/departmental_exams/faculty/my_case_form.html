{% extends "faculty_portal/base.html" %}
{% block title %}{{ heading }} | TeacherMate+{% endblock %}
{% block faculty_content %}
<h1 class="h3">{{ heading }}</h1><p class="alert alert-info">The whole Case is revisioned atomically. Changes will apply to future exams only.</p>
<form method="post" class="card shadow-sm"><div class="card-body">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save Case revision</button> <a class="btn btn-outline-secondary" href="{% url 'departmental_exams:my_questions' %}">Cancel</a></div></form>
{% endblock %}
