{% extends "faculty_portal/base.html" %}
{% block faculty_content %}
<h1 class="h3">Delete question</h1>
<div class="alert alert-warning">This removes the selected question from your Draft and closes the position gap. Other contributors cannot see it.</div>
<div class="card mb-3"><div class="card-body">{{ question.question_text|linebreaksbr }}</div></div>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-danger" type="submit">Delete question</button> <a class="btn btn-outline-secondary" href="{% url 'departmental_exams:contribution_workspace' contribution.id %}">Cancel</a></form>
{% endblock %}
