{% if status == "Ready" %}<span class="badge text-bg-success" role="status">Ready</span>{% elif status == "Blocked" %}<span class="badge text-bg-danger" role="status">Blocked</span>{% elif status == "Already open" %}<span class="badge text-bg-info text-dark" role="status">Already open</span>{% elif status == "Preserved history" %}<span class="badge text-bg-secondary" role="status">Preserved history</span>{% elif status == "Exempt" %}<span class="badge text-bg-warning text-dark" role="status">Exempt</span>{% else %}<span class="badge text-bg-light text-dark border" role="status">{{ status }}</span>{% endif %}
